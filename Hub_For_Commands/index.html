<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub of Commands</title>
    <meta name="description" content="Interactive reference hub for CLI tools, programming languages, and operating systems. Search commands, try them in simulated terminals, and learn with animated visual demos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
</head>

<body>
    <!-- Page Transition Overlay -->
    <div id="transition-overlay" class="transition-overlay"></div>

    <header class="hub-header">
        <h1><span class="typewriter">Hub of Commands</span></h1>
        <p>Guía interactiva de referencia para desarrollo y sistemas operativos.</p>
    </header>

    <main class="hub-container">
        <!-- Search Bar -->
        <div class="hub-search-container">
            <div class="hub-search-wrapper">
                <input type="text" id="hub-search-input" placeholder="Buscar tecnología" autocomplete="off">
                <button type="button" id="hub-search-clear" class="hub-search-clear" aria-label="Limpiar búsqueda">&times;</button>
            </div>
        </div>

        <!-- Segmented Filter Bar — sits at the very top of main -->
        <div class="hub-filter-bar-wrap">
            <nav id="hub-filter-bar" class="hub-filter-bar" aria-label="Filter by category">
                <div class="hub-filter-slider" id="hub-filter-slider"></div>
                <button class="hub-pill active" data-category="all">Todos</button>
                <button class="hub-pill" data-category="cli">CLI &amp; Tools</button>
                <button class="hub-pill" data-category="devops">Infraestructura</button>
                <button class="hub-pill" data-category="backend">Backend &amp; APIs</button>
                <button class="hub-pill" data-category="frontend">Frontend</button>
                <button class="hub-pill" data-category="databases">Bases de Datos</button>
                <button class="hub-pill" data-category="os">Sistemas Operativos</button>
            </nav>
        </div>

        <h2 class="hub-section-title">Commands by topic</h2>
        <p class="hub-section-lead">Explore general tools, programming languages, and operating systems.</p>

        <!-- UNIFIED DYNAMIC GRID -->
        <div id="main-grid" class="cards-grid"></div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Hub de Comandos. Guías interactivas de referencia para desarrollo y sistemas operativos.</p>
    </footer>

    <script src="js/js.js"></script>
    <script src="js/hub-filter.js"></script>
    <script src="js/card-glow.js"></script>
</body>

</html>
